name: Daily Naver blog sync and Pages deploy
on:
  schedule:
    - cron: '0 0 * * *'→ Runs at 00:00 # 09:00 Asia/Seoul
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: blog-sync-and-pages
  cancel-in-progress: false
jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Validate sync code
        run: node --test tests/sync-blog.test.mjs
      - name: Refresh public blog posts
        id: blog-refresh
        continue-on-error: true
        run: node scripts/sync-blog.mjs
      - name: Restore committed site if blog refresh fails
        if: steps.blog-refresh.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Save blog changes
        if: steps.blog-refresh.outcome == 'success'
        run: |
          git add index.html blog-posts.json assets/blog-thumb-* assets/blog-placeholder.svg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update Naver blog posts and thumbnails'
            git push origin HEAD:main
          fi
